[package]
name = "pg_enigma"
version = "0.5.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg15"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []

[dependencies]
hex = "*"
once_cell = "*"
openssl = "~0.10.80"
pgp = "~0.20.0"
pgrx = "~0.20.1"
rand_chacha = "~0.3.1" #TODO: 0.9.0

enigma_macros = { path = "./enigma_macros" }

[dev-dependencies]
pgrx-tests = "~0.20.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
